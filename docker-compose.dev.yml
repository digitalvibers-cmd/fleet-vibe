# Dev server overlay - fleetvibe.digitalvibe.rs / apifleetvibe.digitalvibe.rs / portal-fleetvibe.digitalvibe.rs.
#
# Used by the CI deploy script on the dev server (/opt/fleetvibe):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Secrets come from /opt/fleetvibe/.env (gitignored, chmod 600, owner deploy).
# See .env.dev.example for the required keys.
#
# Host ports 4200/8000/3000/38000 (dev). Prod uses 4201/8001/3001/38001.
# Both stacks coexist on the same Hetzner host.

x-mail-env: &mail-env
  MAIL_MAILER: "mailgun"
  MAILGUN_DOMAIN: "fleetvibe.digitalvibe.rs"
  MAILGUN_SECRET: "${MAILGUN_SECRET}"
  MAILGUN_ENDPOINT: "api.eu.mailgun.net"
  MAIL_FROM_ADDRESS: "delivery@flyboxdelivery.rs"
  MAIL_FROM_NAME: "FlyBox (dev)"

services:
  database:
    command: "--lower-case-table-names=2"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fleetbase"
    ports:
      - "33060:3306"
    volumes:
      - "./docker/database/mysql:/var/lib/mysql"

  socket:
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_OPTIONS: '{"origins":"https://fleetvibe.digitalvibe.rs:* https://portal-fleetvibe.digitalvibe.rs:*"}'

  httpd:
    ports:
      - "8000:80"

  console:
    build:
      args:
        ENVIRONMENT: development
        FLEETBASE_ENV: dev
    ports:
      - "4200:4200"
    volumes:
      - ./console/fleetbase.config.dev.json:/usr/share/nginx/html/fleetbase.config.json

  application:
    environment:
      APP_KEY: "${APP_KEY}"
      APP_URL: "https://apifleetvibe.digitalvibe.rs"
      CONSOLE_HOST: "https://fleetvibe.digitalvibe.rs"
      SESSION_DOMAIN: ".digitalvibe.rs"
      ENVIRONMENT: "development"
      APP_DEBUG: "true"
      API_CACHE_ENABLED: "false"
      DATABASE_URL: "mysql://root@database/fleetbase"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      GOOGLE_MAPS_LOCALE: "sr"
      <<: *mail-env
    volumes:
      - ./packages/fleetops/server:/fleetbase/api/vendor/fleetbase/fleetops-api/server

  queue:
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      GOOGLE_MAPS_LOCALE: "sr"
      <<: *mail-env
    volumes:
      - ./packages/fleetops/server:/fleetbase/api/vendor/fleetbase/fleetops-api/server

  scheduler:
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      GOOGLE_MAPS_LOCALE: "sr"
      <<: *mail-env

  customer-portal:
    build:
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
        NEXT_PUBLIC_GOOGLE_MAPS_LANGUAGE: "sr"
        NEXT_PUBLIC_GOOGLE_MAPS_REGION: "RS"
        NEXT_PUBLIC_PORTAL_URL: "https://portal-fleetvibe.digitalvibe.rs"
    ports:
      - "3000:3000"
    environment:
      FLEETBASE_API_URL: "http://httpd:80"
      NEXT_PUBLIC_PORTAL_URL: "https://portal-fleetvibe.digitalvibe.rs"
      COOKIE_SECRET: "${COOKIE_SECRET}"
