name: Fleet Vibe Prod Deploy (Hetzner)

# Deploys the main branch to production at flybox.rs / console.flybox.rs / api.flybox.rs.
#
# Mechanism: SSH into 46.225.99.48 as the `deploy` user and invoke
# /usr/local/bin/fleetvibe-deploy-prod via sudo NOPASSWD. That script runs
# git fetch + fast-forward merge + docker compose (prod overlay) rebuild of
# console and customer-portal, then brings them back up.
#
# Required repo secret (environment: production):
#   HETZNER_PROD_SSH_KEY — ed25519 private key for deploy@46.225.99.48
#   (same key as HETZNER_DEPLOY_SSH_KEY used for dev)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-prod-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner Production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Deploy console and portal via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.225.99.48
          username: deploy
          key: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          script: |
            sudo -n /usr/local/bin/fleetvibe-deploy-prod

      - name: Rebuild and restart API containers
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.225.99.48
          username: deploy
          key: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /opt/fleetvibe-prod && \
              docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache application && \
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps application queue
