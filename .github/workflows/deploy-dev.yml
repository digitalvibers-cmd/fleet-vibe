name: Fleet Vibe Dev Deploy

on:
  push:
    branches: [ "dev" ]

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

env:
  PROJECT: ${{ vars.DEV_PROJECT }}
  REGISTRY: ${{ vars.DEV_REGISTRY }}
  SOCKETCLUSTER_HOST: ${{ vars.DEV_SOCKETCLUSTER_HOST }}
  API_HOST: ${{ vars.DEV_API_HOST }}
  K8S_CLUSTER_NAME: ${{ vars.DEV_K8S_CLUSTER_NAME }}
  K8S_CLUSTER_LOCATION: ${{ vars.DEV_K8S_CLUSTER_LOCATION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  GCP: "True"

jobs:
  build_and_deploy_api:
    name: Build and Deploy API (Dev)
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v1'
      with:
        token_format: "access_token"
        create_credentials_file: true
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v1'

    - id: 'get-credentials'
      uses: 'google-github-actions/get-gke-credentials@v1'
      with:
        cluster_name: ${{ env.K8S_CLUSTER_NAME }}
        location: ${{ env.K8S_CLUSTER_LOCATION }}

    - uses: 'docker/login-action@v3'
      with:
        registry: ${{ vars.DEV_REGISTRY_HOST }}
        username: 'oauth2accesstoken'
        password: '${{ steps.auth.outputs.access_token }}'

    - name: Build and Release
      uses: docker/bake-action@v2
      env: 
        REGISTRY: ${{ env.REGISTRY }}
        VERSION: dev-${{ github.sha }}
        CACHE: type=gha
      with:
        push: true
        files: |
          ./docker-bake.hcl

    - name: Deploy with Helm
      run: |
        helm upgrade -i fleetbase-dev infra/helm -n dev --set image.repository=${{ env.REGISTRY }} --set image.tag=dev-${{ github.sha }} --set 'api_host=${{ env.API_HOST }}' --set 'socketcluster_host=${{ env.SOCKETCLUSTER_HOST }}'

  deploy_console:
    name: Deploy Console (Dev)
    needs: [build_and_deploy_api]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: true

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v1'
      with:
        token_format: "access_token"
        create_credentials_file: true
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v1'

    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 16

    - uses: pnpm/action-setup@v2
      name: Install pnpm
      with:
        version: 8
        run_install: false

    - name: Install dependencies
      run: pnpm install
      working-directory: ./console

    - name: Build
      env:
        SOCKETCLUSTER_HOST: ${{ env.SOCKETCLUSTER_HOST }}
        API_HOST: ${{ env.API_HOST }}
      run: pnpm build --environment development
      working-directory: ./console

    - name: Deploy Console 🚀
      run: gcloud app deploy --appyaml console/app.yaml console/dist --project=${{ env.PROJECT }} --version=dev
