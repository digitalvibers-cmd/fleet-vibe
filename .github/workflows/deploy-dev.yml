name: Fleet Vibe Dev Deploy (Hetzner)

# Deploys the dev branch to the Hetzner dev server (fleetvibe.digitalvibe.rs).
#
# Mechanism: SSH into the server as the restricted `deploy` user and invoke
# /usr/local/bin/fleetvibe-deploy-dev via sudo NOPASSWD. That script runs
# git fetch + fast-forward merge + docker compose build --no-cache console +
# docker compose up -d console inside /opt/fleetvibe.
#
# Required repo secret:
#   HETZNER_DEPLOY_SSH_KEY — ed25519 private key for deploy@46.225.99.48
#   (public key is already in /home/deploy/.ssh/authorized_keys with
#   no-pty,no-port-forwarding,no-X11-forwarding,no-agent-forwarding).

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

concurrency:
  group: deploy-dev-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner Dev
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.225.99.48
          username: deploy
          key: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          script: |
            sudo -n /usr/local/bin/fleetvibe-deploy-dev

      - name: Rebuild and restart API containers
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.225.99.48
          username: deploy
          key: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /opt/fleetvibe && docker compose build --no-cache application && docker compose up -d application queue
