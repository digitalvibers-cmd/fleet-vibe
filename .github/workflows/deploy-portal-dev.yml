name: Customer Portal Dev Deploy (Hetzner)

# Deploys the customer-portal to dev when files in customer-portal/ change on dev.
#
# Target domain: https://portal-fleetvibe.digitalvibe.rs
#
# Mechanism: SSH into the dev server and invoke the portal-specific deploy
# script, which uses docker-compose.dev.yml.
#
# Required repo secrets:
#   HETZNER_DEPLOY_SSH_KEY - ed25519 private key for deploy@46.225.99.48

on:
  push:
    branches: ["dev"]
    paths:
      - "customer-portal/**"
  workflow_dispatch:

concurrency:
  # Shared with deploy-dev.yml — see comment there.
  group: hetzner-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Portal to Hetzner Dev
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.225.99.48
          username: deploy
          key: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          script: |
            sudo -n /usr/local/bin/fleetvibe-deploy-portal dev

  verify:
    name: Smoke test portal
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check portal responds
        run: |
          curl -fsS --max-time 30 -o /dev/null https://portal-fleetvibe.digitalvibe.rs/login \
            || (echo "Portal not responding" && exit 1)
