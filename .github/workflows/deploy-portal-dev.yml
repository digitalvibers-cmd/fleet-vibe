name: Customer Portal Dev Deploy (Hetzner)

# Deploys the customer-portal to the Hetzner dev server when files in
# customer-portal/ change on the dev branch.
#
# Mechanism: SSH into the server as `deploy` and run the portal-specific
# deploy script that rebuilds and restarts the customer-portal container.
#
# Required repo secrets:
#   HETZNER_DEPLOY_SSH_KEY        — ed25519 private key for deploy@46.225.99.48
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY — Google Maps JS API key (baked into Next.js bundle at build time)

on:
  push:
    branches: ["dev"]
    paths:
      - "customer-portal/**"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: deploy-portal-dev-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Portal to Hetzner Dev
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        with:
          host: 46.225.99.48
          username: deploy
          key: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          envs: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
          script: |
            printf 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=%s\n' "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" > "${HOME}/.portal-env"
            sudo -n /usr/local/bin/fleetvibe-deploy-portal
