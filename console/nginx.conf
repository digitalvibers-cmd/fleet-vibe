server {
    listen       4200;
    server_name  localhost;

    root /usr/share/nginx/html;

    # SPA entry point: never let browsers heuristically cache index.html.
    # Asset file names are fingerprinted, so a stale index would keep pointing
    # at an old (possibly broken) bundle for hours after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        # No trailing "=404": with it, /index.html is served inline from this
        # location and never passes through `location = /index.html` above.
        try_files $uri $uri/ /index.html;
    }

     # Serve runtime config with no cache
    location = /fleetbase.config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        return 200 '{}';
    }
}
