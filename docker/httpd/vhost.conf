server {
  listen 80;
  server_name localhost;
  root /fleetbase/api/public;
  # hide nginx version for security purposes
  server_tokens off;
  access_log  /var/log/nginx/access.log;
  error_log  /var/log/nginx/error_log;
  proxy_connect_timeout       600;
  proxy_send_timeout          600;
  proxy_read_timeout          600;
  send_timeout                600;
  index index.php;

  # Docker embedded DNS resolver. Required for the variable upstream below —
  # without it nginx resolves `application` once at startup and caches the IP
  # forever, leading to 502 Bad Gateway when the application container restarts
  # and gets a new Docker IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # tweaks
  client_max_body_size 600M;
  client_body_buffer_size 1m;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 16k;
  keepalive_timeout 2 2;

  #gzip tweaks
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1100;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain application/javascript application/json application/x-javascript text/xml text/css;

  #open file cache tweaks
  open_file_cache max=2000 inactive=20s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 5;
  open_file_cache_errors off;

  # Serve uploaded files (branding logos, etc.) directly from shared volume
  location /storage/ {
    alias /fleetbase/api/storage/app/public/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    proxy_set_header Host            $host;
    # Indirect proxy_pass via a variable forces nginx to re-resolve the
    # hostname on every cache miss (governed by `resolver ... valid=10s`
    # above) instead of caching the IP at startup.
    set $upstream_app http://${NGINX_APPLICATION_HOSTNAME}:8000;
    proxy_pass   $upstream_app;
  }
}
