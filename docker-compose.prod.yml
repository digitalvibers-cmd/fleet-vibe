# Production overlay - flybox.rs / console.flybox.rs / api.flybox.rs.
#
# Used by the CI deploy script on the prod server (/opt/fleetvibe-prod):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Secrets come from /opt/fleetvibe-prod/.env (gitignored, chmod 600, owner deploy).
# See .env.prod.example for the required keys.
#
# Host ports 4201/8001/3001/38001 (prod), differs from dev (4200/8000/3000/38000)
# so both stacks coexist on the same Hetzner host.

x-mail-env: &mail-env
  MAIL_MAILER: "mailgun"
  MAILGUN_DOMAIN: "fleetvibe.digitalvibe.rs"
  MAILGUN_SECRET: "${MAILGUN_SECRET}"
  MAILGUN_ENDPOINT: "api.eu.mailgun.net"
  MAIL_FROM_ADDRESS: "delivery@flyboxdelivery.rs"
  MAIL_FROM_NAME: "FlyBox"

services:
  database:
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "fleetbase"
    ports:
      - "33061:3306"
    volumes:
      - "fleetvibe-prod-mysql:/var/lib/mysql"

  socket:
    ports:
      - "38001:8000"
    environment:
      SOCKETCLUSTER_OPTIONS: '{"origins":"https://console.flybox.rs:* https://flybox.rs:*"}'

  console:
    build:
      args:
        ENVIRONMENT: production
        FLEETBASE_ENV: prod
    ports:
      - "4201:4200"
    volumes:
      - ./console/fleetbase.config.prod.json:/usr/share/nginx/html/fleetbase.config.json

  httpd:
    ports:
      - "8001:80"

  application:
    environment:
      APP_KEY: "${APP_KEY}"
      APP_URL: "https://api.flybox.rs"
      CONSOLE_HOST: "https://console.flybox.rs"
      SESSION_DOMAIN: ".flybox.rs"
      ENVIRONMENT: "production"
      APP_DEBUG: "false"
      # Disabled: HasApiModelCache trait caches Order list results without
      # including session('user') in the cache key. With per-user directives
      # like CustomerOrders, the cached collection leaks across customers
      # (customer A's orders shown to customer B and vice versa).
      # Re-enable only after the upstream cache key composition is patched.
      API_CACHE_ENABLED: "false"
      DATABASE_URL: "mysql://root:${DB_PASSWORD}@database/fleetbase"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      GOOGLE_MAPS_LOCALE: "sr"
      <<: *mail-env
    volumes:
      - ./packages/fleetops/server:/fleetbase/api/vendor/fleetbase/fleetops-api/server

  queue:
    environment:
      DATABASE_URL: "mysql://root:${DB_PASSWORD}@database/fleetbase"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      GOOGLE_MAPS_LOCALE: "sr"
      <<: *mail-env
    volumes:
      - ./packages/fleetops/server:/fleetbase/api/vendor/fleetbase/fleetops-api/server

  scheduler:
    environment:
      DATABASE_URL: "mysql://root:${DB_PASSWORD}@database/fleetbase"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      GOOGLE_MAPS_LOCALE: "sr"
      <<: *mail-env

  customer-portal:
    build:
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
        NEXT_PUBLIC_GOOGLE_MAPS_LANGUAGE: "sr"
        NEXT_PUBLIC_GOOGLE_MAPS_REGION: "RS"
        NEXT_PUBLIC_PORTAL_URL: "https://flybox.rs"
    ports:
      - "3001:3000"
    environment:
      FLEETBASE_API_URL: "http://httpd:80"
      NEXT_PUBLIC_PORTAL_URL: "https://flybox.rs"
      COOKIE_SECRET: "${COOKIE_SECRET}"

volumes:
  fleetvibe-prod-mysql:
