# Local development overlay - everything runs on localhost.
#
# Usage:
#   make local
#   # or explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Secrets come from .env in this directory (gitignored).
# Copy .env.local.example to .env and fill in values, OR run scripts/local-setup.sh.
#
# Mail goes to laravel.log (MAIL_MAILER=log) so local dev cannot accidentally
# send real emails to customers — even though Mailgun credentials are valid.

x-mail-env: &mail-env
  MAIL_MAILER: "log"
  MAIL_FROM_ADDRESS: "delivery@flyboxdelivery.rs"
  MAIL_FROM_NAME: "FlyBox (local)"

services:
  database:
    command: "--lower-case-table-names=2"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fleetbase"
    ports:
      - "33060:3306"
    volumes:
      - "./docker/database/mysql:/var/lib/mysql"

  socket:
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_OPTIONS: '{"origins":"http://localhost:* https://localhost:* ws://localhost:* wss://localhost:*"}'

  httpd:
    ports:
      - "8000:80"

  console:
    build:
      args:
        ENVIRONMENT: development
        FLEETBASE_ENV: local
    ports:
      - "4200:4200"
    volumes:
      - ./console/fleetbase.config.local.json:/usr/share/nginx/html/fleetbase.config.json

  application:
    environment:
      APP_KEY: "${APP_KEY}"
      APP_URL: "http://localhost:8000"
      CONSOLE_HOST: "http://localhost:4200"
      SESSION_DOMAIN: "localhost"
      ENVIRONMENT: "development"
      APP_DEBUG: "true"
      API_CACHE_ENABLED: "false"
      DATABASE_URL: "mysql://root@database/fleetbase"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      <<: *mail-env
    volumes:
      - ./packages/fleetops/server:/fleetbase/api/vendor/fleetbase/fleetops-api/server

  queue:
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      <<: *mail-env
    volumes:
      - ./packages/fleetops/server:/fleetbase/api/vendor/fleetbase/fleetops-api/server

  scheduler:
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      <<: *mail-env

  customer-portal:
    build:
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
        NEXT_PUBLIC_PORTAL_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    environment:
      FLEETBASE_API_URL: "http://httpd:80"
      NEXT_PUBLIC_PORTAL_URL: "http://localhost:3000"
      COOKIE_SECRET: "${COOKIE_SECRET}"
