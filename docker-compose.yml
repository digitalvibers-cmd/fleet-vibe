# Base service definitions for Fleetbase / LogiVibe.
#
# This file declares the services and their stable defaults. Environment-
# specific values (URLs, secrets, ports, mail config, volume mounts that
# differ per environment) live in overlay files:
#
#   docker-compose.local.yml  - local development (localhost)
#   docker-compose.dev.yml    - dev server (fleetvibe.digitalvibe.rs)
#   docker-compose.prod.yml   - prod server (flybox.rs)
#
# Run with the Makefile (recommended):
#   make local    # docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   make dev      # on dev server
#   make prod     # on prod server
#
# Secrets are injected via the auto-loaded `.env` file in this directory
# (gitignored). Copy .env.local.example to .env for first-time setup.

services:
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10

  scheduler:
    image: fleetbase/fleetbase-api:latest
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    environment:
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  queue:
    image: fleetbase/fleetbase-api:latest
    command: ["php", "artisan", "queue:work"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  console:
    build:
      context: .
      dockerfile: console/Dockerfile.dev

  application:
    image: fleetbase/fleetbase-api:latest
    restart: unless-stopped
    volumes:
      - storage-uploads:/fleetbase/api/storage/app/public
    environment:
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      BROADCAST_DRIVER: socketcluster
      APP_NAME: Fleetbase
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: 'true'
      OSRM_HOST: https://router.project-osrm.org
    depends_on:
      - database
      - cache
      - queue

  customer-portal:
    build:
      context: ./customer-portal
    depends_on:
      - httpd

  httpd:
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    volumes:
      - storage-uploads:/fleetbase/api/storage/app/public:ro
    depends_on:
      - application

volumes:
  storage-uploads:
